AWSTemplateFormatVersion: '2010-09-09'
Description: >
  AWS CloudFormation Template for Incremental Travel Booking Data Pipeline.
  Provisions S3 Data Lake (with EventBridge notifications), IAM Roles, 
  Glue Catalog Database, Glue PySpark Job (Bookmarks enabled),
  Glue Crawler, Glue Workflow, and EventBridge S3 Event Rule.

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: Deployment target environment.

  GlueWorkerType:
    Type: String
    Default: G.1X
    AllowedValues: [G.1X, G.2X]
    Description: Worker type for AWS Glue ETL job.

  NumberOfWorkers:
    Type: Number
    Default: 2
    MinValue: 2
    MaxValue: 10
    Description: Number of AWS Glue G.1X workers (minimum 2 for cost-efficiency).

Resources:
  # =========================================================================
  # 1. S3 Data Lake Bucket
  # =========================================================================
  DataLakeBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'travel-booking-pipeline-${AWS::AccountId}-${AWS::Region}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      NotificationConfiguration:
        EventBridgeConfiguration:
          EventBridgeEnabled: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireRawCsvAfter90Days
            Status: Enabled
            Prefix: raw-data/
            ExpirationInDays: 90
            NoncurrentVersionExpirationInDays: 30

  # =========================================================================
  # 2. IAM Roles & Least Privilege Policies
  # =========================================================================
  GlueServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'GlueServiceRole-TravelDataPipeline-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: glue.amazonaws.com
            Action: sts:AssumeRole
      Path: /
      Policies:
        - PolicyName: GlueS3DataLakePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt DataLakeBucket.Arn
                  - !Sub '${DataLakeBucket.Arn}/*'
        - PolicyName: GlueDataCatalogPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - glue:GetDatabase
                  - glue:GetDatabases
                  - glue:GetTable
                  - glue:GetTables
                  - glue:CreateTable
                  - glue:UpdateTable
                  - glue:GetPartition
                  - glue:GetPartitions
                  - glue:BatchCreatePartition
                  - glue:BatchGetPartition
                Resource:
                  - !Sub 'arn:aws:glue:${AWS::Region}:${AWS::AccountId}:catalog'
                  - !Sub 'arn:aws:glue:${AWS::Region}:${AWS::AccountId}:database/travel_bookings_db'
                  - !Sub 'arn:aws:glue:${AWS::Region}:${AWS::AccountId}:table/travel_bookings_db/*'
        - PolicyName: GlueCloudWatchLogsPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws-glue/*'

  EventBridgeGlueRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'EventBridgeGlueRole-TravelDataPipeline-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
      Path: /
      Policies:
        - PolicyName: EventBridgeTriggerGlueWorkflowPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - glue:notifyEvent
                  - glue:StartWorkflowRun
                Resource:
                  - !Sub 'arn:aws:glue:${AWS::Region}:${AWS::AccountId}:workflow/travel_bookings_pipeline_workflow'

  # =========================================================================
  # 3. AWS Glue Data Catalog Database
  # =========================================================================
  GlueDatabase:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: travel_bookings_db
        Description: Data catalog database for incremental travel bookings data lake

  # =========================================================================
  # 4. AWS Glue Crawler for Raw Schema Discovery
  # =========================================================================
  RawBookingsCrawler:
    Type: AWS::Glue::Crawler
    Properties:
      Name: travel_bookings_raw_crawler
      Role: !GetAtt GlueServiceRole.Arn
      DatabaseName: !Ref GlueDatabase
      Description: Discovers schema of newly uploaded CSV files in raw-data/
      Targets:
        S3Targets:
          - Path: !Sub 's3://${DataLakeBucket}/raw-data/'
      SchemaChangePolicy:
        UpdateBehavior: UPDATE_IN_DATABASE
        DeleteBehavior: LOG
      RecrawlPolicy:
        RecrawlBehavior: CRAWL_NEW_FOLDERS_ONLY

  # =========================================================================
  # 5. AWS Glue PySpark Job (Bookmarks Enabled)
  # =========================================================================
  IncrementalGlueJob:
    Type: AWS::Glue::Job
    Properties:
      Name: incremental_travel_bookings_etl
      Role: !GetAtt GlueServiceRole.Arn
      GlueVersion: '4.0'
      WorkerType: !Ref GlueWorkerType
      NumberOfWorkers: !Ref NumberOfWorkers
      Timeout: 15
      MaxRetries: 1
      Command:
        Name: glueetl
        ScriptLocation: !Sub 's3://${DataLakeBucket}/scripts/glue_etl_job.py'
        PythonVersion: '3'
      DefaultArguments:
        '--job-bookmark-option': 'job-bookmark-enable'
        '--enable-metrics': 'true'
        '--enable-continuous-cloudwatch-log': 'true'
        '--enable-spark-ui': 'true'
        '--spark-event-logs-path': !Sub 's3://${DataLakeBucket}/spark-logs/'
        '--extra-py-files': !Sub 's3://${DataLakeBucket}/scripts/common_utils.py,s3://${DataLakeBucket}/scripts/data_validation.py'
        '--RAW_S3_PATH': !Sub 's3://${DataLakeBucket}/raw-data/'
        '--PROCESSED_S3_PATH': !Sub 's3://${DataLakeBucket}/processed/bookings/'
        '--INVALID_S3_PATH': !Sub 's3://${DataLakeBucket}/invalid_records/'
        '--conf': 'spark.sql.sources.partitionOverwriteMode=dynamic'

  # =========================================================================
  # 6. AWS Glue Workflow and Triggers
  # =========================================================================
  PipelineWorkflow:
    Type: AWS::Glue::Workflow
    Properties:
      Name: travel_bookings_pipeline_workflow
      Description: Orchestrates end-to-end ingestion, schema discovery, and incremental ETL

  # Trigger 1: Event-driven starter that runs the crawler when EventBridge fires
  WorkflowStartTrigger:
    Type: AWS::Glue::Trigger
    Properties:
      Name: trigger_start_crawler
      WorkflowName: !Ref PipelineWorkflow
      Type: EVENT
      Actions:
        - CrawlerName: !Ref RawBookingsCrawler

  # Trigger 2: Conditional trigger - runs Glue ETL Job after crawler succeeds
  WorkflowJobTrigger:
    Type: AWS::Glue::Trigger
    Properties:
      Name: trigger_etl_after_crawler
      WorkflowName: !Ref PipelineWorkflow
      Type: CONDITIONAL
      StartOnCreation: true
      Predicate:
        Conditions:
          - LogicalOperator: EQUALS
            CrawlerName: !Ref RawBookingsCrawler
            CrawlState: SUCCEEDED
      Actions:
        - JobName: !Ref IncrementalGlueJob

  # =========================================================================
  # 7. Amazon EventBridge Rule for S3 CSV File Creation
  # =========================================================================
  S3UploadEventRule:
    Type: AWS::Events::Rule
    Properties:
      Name: travel_bookings_s3_upload_rule
      Description: Detects new CSV files uploaded into raw-data/ and triggers the Glue Workflow
      State: ENABLED
      EventPattern:
        source:
          - aws.s3
        detail-type:
          - 'Object Created'
        detail:
          bucket:
            name:
              - !Ref DataLakeBucket
          object:
            key:
              - prefix: raw-data/
                suffix: .csv
      Targets:
        - Arn: !Sub 'arn:aws:glue:${AWS::Region}:${AWS::AccountId}:workflow/${PipelineWorkflow}'
          Id: TargetGlueWorkflow
          RoleArn: !GetAtt EventBridgeGlueRole.Arn

Outputs:
  DataLakeBucketName:
    Description: Name of S3 Data Lake Bucket
    Value: !Ref DataLakeBucket
    Export:
      Name: !Sub '${AWS::StackName}-DataLakeBucket'

  GlueDatabaseName:
    Description: Glue Data Catalog Database Name
    Value: !Ref GlueDatabase

  GlueJobName:
    Description: Name of Incremental Glue PySpark Job
    Value: !Ref IncrementalGlueJob

  GlueWorkflowName:
    Description: Name of AWS Glue Orchestration Workflow
    Value: !Ref PipelineWorkflow
